# Local development stack for DevOps RAG Assistant
# Requires Docker Desktop: https://www.docker.com/products/docker-desktop/

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devops-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devops_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devops_rag_secret}
      POSTGRES_DB: ${POSTGRES_DB:-devops_rag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devops_rag} -d ${POSTGRES_DB:-devops_rag}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rag-engine:
    build:
      context: ./rag-engine
      dockerfile: Dockerfile
    container_name: devops-rag-engine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-devops_rag}:${POSTGRES_PASSWORD:-devops_rag_secret}@postgres:5432/${POSTGRES_DB:-devops_rag}
    ports:
      - "${RAG_ENGINE_PORT:-8000}:8000"
    volumes:
      - ./rag-engine/app:/app/app:ro
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devops-rag-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-devops_rag}:${POSTGRES_PASSWORD:-devops_rag_secret}@postgres:5432/${POSTGRES_DB:-devops_rag}
      RAG_ENGINE_URL: http://rag-engine:8000
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      - postgres
      - rag-engine

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devops-rag-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
