kind: ConfigMap
metadata:
  name: payment-service-config
  namespace: staging
  labels:
    app: payment-service
data:
  gateway_timeout_seconds: "5"
  max_retries: "3"
  log_level: "debug"
  # Changed from 30 to 5 on 2024-06-14 in MR !287 (deploy-payment-staging.yml)
  # Previous value: gateway_timeout_seconds: "30"
