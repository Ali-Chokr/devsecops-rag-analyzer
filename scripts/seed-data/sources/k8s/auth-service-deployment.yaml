apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: staging
  labels:
    app: auth-service
    environment: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        version: v1.8.0
    spec:
      containers:
        - name: auth-service
          image: registry.example.com/auth-service:v1.8.0
          ports:
            - containerPort: 8081
          env:
            - name: JWT_SECRET_REF
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: jwt-signing-key
            - name: ENVIRONMENT
              value: staging
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
