apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devsecops-rag
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: <account>.dkr.ecr.us-east-1.amazonaws.com/devsecops-rag-backend:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: devsecops-rag-config
            - secretRef:
                name: devsecops-rag-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: devsecops-rag
spec:
  selector:
    app: backend
  ports:
    - port: 3000
      targetPort: 3000
