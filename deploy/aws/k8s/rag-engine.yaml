apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-engine
  namespace: devsecops-rag
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-engine
  template:
    metadata:
      labels:
        app: rag-engine
    spec:
      containers:
        - name: rag-engine
          image: <account>.dkr.ecr.us-east-1.amazonaws.com/devsecops-rag-engine:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: devsecops-rag-config
            - secretRef:
                name: devsecops-rag-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: rag-engine
  namespace: devsecops-rag
spec:
  selector:
    app: rag-engine
  ports:
    - port: 8000
      targetPort: 8000
